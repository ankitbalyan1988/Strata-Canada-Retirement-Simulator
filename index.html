<html lang="en">

    <meta charset="UTF-8" />

    <meta name="description" content="Strata is an institutional-grade Canadian retirement and wealth platform modeling RRSP, TFSA, FHSA, Non-Registered accounts, CPP, and OAS with real provincial and federal tax optimization." />
    <meta property="og:title" content="Strata | Canadian Wealth & Retirement Intelligence" />

    <script>
      (function() {
        try {
          const theme = localStorage.getItem('strata-theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
